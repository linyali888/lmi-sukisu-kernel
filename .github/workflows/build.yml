name: Build lmi SukiSU-Ultra SUSFS kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libfl-dev zip curl \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi gcc-arm-linux-gnueabi

      - name: Setup Neutron clang
        run: |
          mkdir -p "$HOME/clang" && cd "$HOME/clang"
          curl -LSs -o antman "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S=latest
          ./antman --patch=glibc
          ./clang --version | head -2
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"

      - name: Clone kernel source at pinned commit
        run: |
          git init kernel && cd kernel
          git remote add origin https://github.com/LineageOS/android_kernel_xiaomi_sm8250
          git fetch --depth=1 origin 68c1588cf8d6e0ac4e4d023547edc931a57b996f
          git checkout --quiet FETCH_HEAD
          git log --oneline -1

      - name: Integrate SukiSU-Ultra driver (builtin, non-GKI)
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          ls -la drivers/kernelsu/ | head -8
          grep -q 'config KSU' drivers/kernelsu/Kconfig
          grep -q 'depends on KPROBES' drivers/kernelsu/Kconfig && { echo "wrong driver branch (kprobes dep)"; exit 1; }
          sed -i 's|#include <linux/static_call.h>|#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)\n#include <linux/static_call.h>\n#endif|' drivers/kernelsu/kernel_includes.h
          grep -A1 'static_call.h' drivers/kernelsu/kernel_includes.h | head -3
          patch -p1 --fuzz=3 < "$GITHUB_WORKSPACE/driver-fixes/0001-cpu_spoof-4.19-vdso-guard.patch"
          patch -p1 --fuzz=3 < "$GITHUB_WORKSPACE/driver-fixes/0002-kpm-4.19-access_ok.patch"
          patch -p1 --fuzz=3 < "$GITHUB_WORKSPACE/driver-fixes/0003-feature-4.19-selinux-hide-gate.patch"
          patch -p1 --fuzz=3 < "$GITHUB_WORKSPACE/driver-fixes/0004-ksud-4.19-selinux-hide-gate.patch"
          patch -p1 --fuzz=3 < "$GITHUB_WORKSPACE/driver-fixes/0005-rules-4.19-unused-vars.patch"
          test -z "$(find drivers/kernelsu -name '*.rej')"

      - name: Install susfs v2.2.0 kernel-side (AstideLabs-integrated)
        run: |
          cd kernel
          cp "$GITHUB_WORKSPACE/susfs-v2/include/linux/susfs.h" include/linux/susfs.h
          cp "$GITHUB_WORKSPACE/susfs-v2/include/linux/susfs_def.h" include/linux/susfs_def.h
          for f in dcache.c namei.c namespace.c readdir.c stat.c statfs.c proc_namespace.c; do
            cp "$GITHUB_WORKSPACE/susfs-v2/fs/$f" "fs/$f"
          done
          cp "$GITHUB_WORKSPACE/susfs-v2/fs/notify/fdinfo.c" fs/notify/fdinfo.c
          cp "$GITHUB_WORKSPACE/susfs-v2/fs/proc/cmdline.c" fs/proc/cmdline.c
          cp "$GITHUB_WORKSPACE/susfs-v2/fs/proc/fd.c" fs/proc/fd.c
          # task_mmu.c skipped: astide copy targets a pre-mmap_lock tree; smaps sus-path filtering added later
          cp "$GITHUB_WORKSPACE/susfs-v2/fs/susfs.c" fs/susfs.c
          grep -q 'susfs.o' fs/Makefile || echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile
          test -f fs/susfs.c
          grep -q 'SUSFS_MAGIC' include/linux/susfs_def.h
          grep -q 'susfs_is_sdcard_android_data_not_decrypted' fs/namespace.c
          grep -q 'susfs.o' fs/Makefile

      - name: Configure kernel (phone config + overlay)
        run: |
          cd kernel
          cp "$GITHUB_WORKSPACE/lmi_phone_defconfig" arch/arm64/configs/lmi_phone_defconfig
          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- lmi_phone_defconfig
          scripts/kconfig/merge_config.sh -m -O out out/.config "$GITHUB_WORKSPACE/overlay.config"
          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -E 'CONFIG_KSU=|CONFIG_KPM=|CONFIG_KSU_SUSFS=|CONFIG_LOCALVERSION=' out/.config
          test "$(grep -c '^CONFIG_KSU_SUSFS' out/.config)" -ge 10

      - name: Build Image and dtbs
        run: |
          cd kernel
          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- -j"$(nproc)" Image dtbs
          ls -la out/arch/arm64/boot/Image
          strings out/arch/arm64/boot/Image | grep -m5 -E 'susfs_[a-z_]+' | head -5

      - name: Package AnyKernel3 zip
        run: |
          mkdir -p ak3/kernels
          cp kernel/out/arch/arm64/boot/Image ak3/kernels/Image
          cd ak3
          chmod +x META-INF/com/google/android/update-binary tools/* 2>/dev/null || true
          zip -r9 "../lmi-sukisu-ultra-4.2.1-susfs-AnyKernel3.zip" .
          cd ..
          sha256sum lmi-sukisu-ultra-4.2.1-susfs-AnyKernel3.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lmi-sukisu-susfs-ak3
          path: |
            lmi-sukisu-ultra-4.2.1-susfs-AnyKernel3.zip
            kernel/out/arch/arm64/boot/Image
